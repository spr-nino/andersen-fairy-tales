<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>安徒生童话世界 — 沉浸式儿童阅读</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23EE7B4B'/%3E%3Cpath d='M7 8c5-1 9 0 9 3v13c0-3-4-4-9-3V8Zm18 0c-5-1-9 0-9 3v13c0-3 4-4 9-3V8Z' fill='none' stroke='white' stroke-width='2'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<style>
/* ============================================================
   CSS VARIABLES
   ============================================================ */
:root {
  --cream: #FFF8E7;
  --warm-beige: #F5E6D3;
  --pale-gold: #D4A853;
  --light-wood: #C4A882;
  --dark-wood: #8B6914;
  --starry-blue: #1a2a3a;
  --mist-blue: #B8C9D5;
  --blush-pink: #F0D5D5;
  --text-primary: #3E2723;
  --text-secondary: #5D4037;
  --card-bg: rgba(255, 248, 231, 0.78);
  --glow-warm: rgba(212, 168, 83, 0.25);
  --sidebar-bg: linear-gradient(180deg, #5C3D2E 0%, #8B6914 30%, #A0825A 60%, #6B4F32 100%);
  --sidebar-width: 280px;
  --font-size-sm: 16px;
  --font-size-md: 19px;
  --font-size-lg: 22px;
  --line-height: 2;
  --transition-slow: 0.6s cubic-bezier(0.4, 0, 0.2, 1);
  --transition-med: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  --transition-fast: 0.2s ease;
}

/* Night mode */
body.night {
  --cream: #1a1a2e;
  --warm-beige: #16213e;
  --text-primary: #E8D5A3;
  --text-secondary: #C4A882;
  --card-bg: rgba(26, 26, 46, 0.82);
  --glow-warm: rgba(232, 213, 163, 0.2);
  --starry-blue: #0a0a1a;
}

/* ============================================================
   RESET & BASE
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  overflow: hidden;
  font-family: 'Noto Serif SC', 'SimSun', 'STSong', serif;
  color: var(--text-primary);
  background: var(--starry-blue);
  -webkit-font-smoothing: antialiased;
  user-select: none;
}

body { opacity: 0; transition: opacity 0.4s ease; }
body.loaded { opacity: 1; }

/* Scrollbar */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--light-wood); border-radius: 3px; }

/* ============================================================
   WELCOME OVERLAY
   ============================================================ */
#welcome-overlay {
  position: fixed; inset: 0; z-index: 9999;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: radial-gradient(ellipse at center, #1a2a3a 0%, #0a0f18 70%);
  transition: opacity 1s ease, visibility 1s ease;
}
#welcome-overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

.welcome-stars {
  position: absolute; inset: 0; overflow: hidden;
}
.welcome-star {
  position: absolute;
  width: 2px; height: 2px;
  background: #fff;
  border-radius: 50%;
  animation: twinkle var(--dur) ease-in-out infinite;
  animation-delay: var(--delay);
  opacity: 0;
}
@keyframes twinkle {
  0%, 100% { opacity: 0.2; transform: scale(1); }
  50% { opacity: 1; transform: scale(1.8); }
}

.book-container {
  perspective: 1200px;
  margin-bottom: 40px;
}
.book {
  width: 280px; height: 360px;
  position: relative;
  transform-style: preserve-3d;
  animation: bookAppear 1.2s ease forwards;
}
@keyframes bookAppear {
  0% { transform: rotateY(90deg) scale(0.3); opacity: 0; }
  60% { transform: rotateY(-10deg) scale(1.05); opacity: 1; }
  100% { transform: rotateY(0) scale(1); opacity: 1; }
}
.book-cover {
  width: 100%; height: 100%;
  background: linear-gradient(135deg, #8B4513 0%, #A0522D 30%, #6B3410 60%, #8B4513 100%);
  border-radius: 8px 20px 20px 8px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 40px rgba(212,168,83,0.3);
  position: relative;
  overflow: hidden;
  border: 3px solid #D4A853;
}
.book-cover::before {
  content: '';
  position: absolute; inset: 10px;
  border: 2px solid rgba(212,168,83,0.5);
  border-radius: 4px 14px 14px 4px;
}
.book-cover::after {
  content: '📖';
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  font-size: 80px;
  filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
}
.book-spine {
  position: absolute; left: 0; top: 0; bottom: 0;
  width: 24px;
  background: linear-gradient(90deg, #5C3D2E, #8B6914, #5C3D2E);
  border-radius: 8px 0 0 8px;
}
.book-glow {
  position: absolute; inset: -20px;
  background: radial-gradient(ellipse, rgba(212,168,83,0.4) 0%, transparent 70%);
  animation: glowPulse 3s ease-in-out infinite;
}
@keyframes glowPulse {
  0%, 100% { opacity: 0.5; }
  50% { opacity: 1; }
}

.welcome-title {
  font-family: 'ZCOOL KuaiLe', 'Noto Serif SC', cursive;
  font-size: 42px;
  color: #E8D5A3;
  text-shadow: 0 0 20px rgba(212,168,83,0.5), 0 2px 4px rgba(0,0,0,0.5);
  margin-bottom: 12px;
  animation: fadeInUp 0.8s 0.6s ease both;
  text-align: center;
}
.welcome-subtitle {
  font-size: 18px;
  color: #C4A882;
  letter-spacing: 4px;
  margin-bottom: 40px;
  animation: fadeInUp 0.8s 0.9s ease both;
}
.welcome-btn {
  padding: 16px 48px;
  font-size: 20px;
  font-family: 'ZCOOL KuaiLe', 'Noto Serif SC', cursive;
  color: #FFF8E7;
  background: linear-gradient(135deg, #8B6914, #D4A853, #8B6914);
  border: none;
  border-radius: 50px;
  cursor: pointer;
  box-shadow: 0 8px 24px rgba(139,105,20,0.4);
  transition: all 0.3s ease;
  animation: fadeInUp 0.8s 1.2s ease both;
  letter-spacing: 2px;
}
.welcome-btn:hover {
  transform: translateY(-3px);
  box-shadow: 0 12px 32px rgba(212,168,83,0.5);
}
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(30px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Floating particles on welcome */
.welcome-particle {
  position: absolute;
  pointer-events: none;
  animation: floatUp var(--dur) linear infinite;
  animation-delay: var(--delay);
  opacity: 0;
  font-size: var(--size);
}
@keyframes floatUp {
  0% { opacity: 0; transform: translateY(100vh) rotate(0deg); }
  10% { opacity: 0.8; }
  90% { opacity: 0.8; }
  100% { opacity: 0; transform: translateY(-10vh) rotate(360deg); }
}

/* ============================================================
   MAIN CONTAINER
   ============================================================ */
#main-app {
  display: grid;
  grid-template-columns: var(--sidebar-width) 1fr;
  height: 100vh;
  opacity: 0;
  transition: opacity 0.8s ease;
}
#main-app.visible { opacity: 1; }

/* ============================================================
   SIDEBAR
   ============================================================ */
#sidebar {
  background: linear-gradient(180deg, #4A2C1A 0%, #6B4F32 5%, #8B6914 25%, #A0825A 55%, #6B4F32 95%, #3E1F0D 100%);
  display: flex;
  flex-direction: column;
  border-right: 3px solid #5C3D2E;
  box-shadow: 4px 0 20px rgba(0,0,0,0.3);
  position: relative;
  z-index: 10;
  overflow: hidden;
}
#sidebar::before {
  content: '';
  position: absolute; inset: 0;
  background:
    repeating-linear-gradient(0deg, transparent, transparent 8px, rgba(255,255,255,0.015) 8px, rgba(255,255,255,0.015) 9px),
    repeating-linear-gradient(90deg, transparent, transparent 40px, rgba(0,0,0,0.05) 40px, rgba(0,0,0,0.05) 41px);
  pointer-events: none;
}
/* Wood knots */
#sidebar::after {
  content: '';
  position: absolute; inset: 0; pointer-events: none;
  background:
    radial-gradient(circle at 30% 15%, rgba(0,0,0,0.15) 0%, transparent 20px),
    radial-gradient(circle at 70% 40%, rgba(0,0,0,0.1) 0%, transparent 15px),
    radial-gradient(circle at 25% 70%, rgba(0,0,0,0.12) 0%, transparent 18px),
    radial-gradient(circle at 65% 85%, rgba(0,0,0,0.1) 0%, transparent 14px);
}

.sidebar-header {
  padding: 24px 20px 16px;
  text-align: center;
  position: relative;
  z-index: 1;
  border-bottom: 2px solid rgba(212,168,83,0.3);
}
.sidebar-header h2 {
  font-family: 'ZCOOL KuaiLe', cursive;
  font-size: 24px;
  color: #FFE8C0;
  text-shadow: 0 0 12px rgba(255,232,192,0.4);
  letter-spacing: 2px;
}
.sidebar-header .lamp-icon {
  font-size: 28px;
  display: block;
  margin-bottom: 4px;
  animation: glowPulse 3s ease-in-out infinite;
}

.story-list {
  flex: 1;
  overflow-y: auto;
  padding: 8px 12px 16px;
  position: relative;
  z-index: 1;
}
.story-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  margin-bottom: 3px;
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.3s ease;
  color: #FFE8C0;
  font-size: 15px;
  position: relative;
  border: 1px solid transparent;
}
.story-item:hover {
  background: rgba(255,255,255,0.1);
  transform: translateX(4px) scale(1.02);
  border-color: rgba(212,168,83,0.3);
}
.story-item.active {
  background: rgba(212,168,83,0.2);
  border-color: rgba(212,168,83,0.6);
  box-shadow: 0 0 16px rgba(212,168,83,0.25), inset 0 0 12px rgba(212,168,83,0.1);
  font-weight: 600;
}
.story-item .icon {
  font-size: 22px;
  width: 32px;
  text-align: center;
  flex-shrink: 0;
}
.story-item .name {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.story-item.active::before {
  content: '✨';
  position: absolute;
  right: 10px;
  font-size: 12px;
  animation: twinkle 2s ease-in-out infinite;
}

/* ============================================================
   CONTENT AREA
   ============================================================ */
#content-area {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  background: var(--starry-blue);
}

/* Canvas layers */
.canvas-layer {
  position: absolute; inset: 0;
  pointer-events: none;
}
#bg-canvas { z-index: 0; }
#particle-canvas { z-index: 1; }

/* Ambient light overlay */
.ambient-light {
  position: absolute; inset: 0; z-index: 2; pointer-events: none;
  background: radial-gradient(ellipse at 70% 30%, rgba(255,232,192,0.08) 0%, transparent 60%),
              radial-gradient(ellipse at 30% 70%, rgba(180,200,220,0.06) 0%, transparent 50%);
  transition: background 1s ease;
}
body.night .ambient-light {
  background: radial-gradient(ellipse at 70% 30%, rgba(212,168,83,0.06) 0%, transparent 60%),
              radial-gradient(ellipse at 30% 70%, rgba(100,150,200,0.04) 0%, transparent 50%);
}

/* ============================================================
   READING CARD
   ============================================================ */
.reading-card-wrapper {
  position: relative;
  z-index: 5;
  width: 85%;
  max-width: 800px;
  height: 85%;
  animation: cardIn 0.8s ease;
}
@keyframes cardIn {
  from { opacity: 0; transform: translateY(20px) scale(0.96); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
.reading-card-wrapper.page-flip {
  animation: pageFlip 0.5s ease;
}
@keyframes pageFlip {
  0% { opacity: 0; transform: perspective(800px) rotateY(-15deg) scale(0.9); }
  100% { opacity: 1; transform: perspective(800px) rotateY(0) scale(1); }
}

.reading-card {
  background: var(--card-bg);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border-radius: 24px;
  box-shadow:
    0 8px 32px rgba(0,0,0,0.12),
    0 0 0 1px rgba(255,255,255,0.15),
    inset 0 1px 0 rgba(255,255,255,0.1);
  height: 100%;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  transition: background 0.5s ease, box-shadow 0.5s ease;
  animation: cardGlow 4s ease-in-out infinite;
}
@keyframes cardGlow {
  0%, 100% { box-shadow: 0 8px 32px rgba(0,0,0,0.12), 0 0 0 1px rgba(255,255,255,0.15), 0 0 20px rgba(212,168,83,0.1); }
  50% { box-shadow: 0 8px 32px rgba(0,0,0,0.12), 0 0 0 1px rgba(255,255,255,0.15), 0 0 32px rgba(212,168,83,0.2); }
}

.card-header {
  padding: 28px 36px 16px;
  border-bottom: 1px solid rgba(139,105,20,0.15);
  flex-shrink: 0;
}
.card-header .story-title {
  font-family: 'ZCOOL KuaiLe', 'Noto Serif SC', cursive;
  font-size: 30px;
  color: var(--text-primary);
  margin-bottom: 4px;
}
.card-header .story-subtitle {
  font-size: 14px;
  color: var(--text-secondary);
  font-style: italic;
  letter-spacing: 1px;
}
.card-header .story-summary {
  font-size: 14px;
  color: var(--text-secondary);
  margin-top: 8px;
  line-height: 1.6;
  opacity: 0.8;
}

.card-body {
  flex: 1;
  overflow-y: auto;
  padding: 24px 36px 36px;
  font-size: var(--font-size-md);
  line-height: var(--line-height);
  color: var(--text-primary);
}
.card-body p {
  margin-bottom: 1.2em;
  text-indent: 2em;
  text-align: justify;
}

/* ============================================================
   CONTROLS BAR
   ============================================================ */
.controls-bar {
  position: absolute;
  bottom: 20px;
  right: 20px;
  z-index: 10;
  display: flex;
  gap: 10px;
  align-items: center;
}
.control-btn {
  width: 44px; height: 44px;
  border-radius: 50%;
  border: 1px solid rgba(139,105,20,0.2);
  background: var(--card-bg);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  cursor: pointer;
  font-size: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.3s ease;
  color: var(--text-primary);
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}
.control-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 4px 16px rgba(0,0,0,0.15);
  border-color: rgba(212,168,83,0.4);
}
.control-btn.active {
  background: rgba(212,168,83,0.25);
  border-color: rgba(212,168,83,0.5);
}

/* Font size badge */
.font-size-badge {
  position: absolute;
  top: -6px; right: -6px;
  font-size: 10px;
  background: var(--pale-gold);
  color: #fff;
  width: 18px; height: 18px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Reading progress */
.reading-progress {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 3px;
  background: rgba(139,105,20,0.1);
  z-index: 10;
}
.reading-progress-bar {
  height: 100%;
  background: linear-gradient(90deg, transparent, var(--pale-gold), var(--pale-gold));
  transition: width 0.3s ease;
}

/* Welcome back / last read indicator */
.last-read-indicator {
  position: absolute;
  top: 20px;
  right: 20px;
  z-index: 10;
  font-size: 12px;
  color: var(--text-secondary);
  opacity: 0.7;
  background: var(--card-bg);
  backdrop-filter: blur(10px);
  padding: 6px 14px;
  border-radius: 20px;
  border: 1px solid rgba(139,105,20,0.15);
}

/* ============================================================
   MOBILE MENU TOGGLE
   ============================================================ */
.mobile-menu-btn {
  display: none;
  position: fixed;
  top: 14px;
  left: 14px;
  z-index: 100;
  width: 44px; height: 44px;
  border-radius: 50%;
  border: 1px solid rgba(139,105,20,0.3);
  background: var(--card-bg);
  backdrop-filter: blur(10px);
  cursor: pointer;
  font-size: 22px;
  color: var(--text-primary);
  align-items: center;
  justify-content: center;
  box-shadow: 0 2px 12px rgba(0,0,0,0.1);
}

/* Sidebar overlay for mobile */
.sidebar-overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.4);
  z-index: 49;
}

/* ============================================================
   CLOUD ELEMENTS
   ============================================================ */
.cloud {
  position: absolute; z-index: 3; pointer-events: none;
  background: rgba(255,255,255,0.15);
  border-radius: 50%;
  animation: cloudDrift var(--dur) linear infinite;
  animation-delay: var(--delay);
}
.cloud::before, .cloud::after {
  content: '';
  position: absolute;
  background: inherit;
  border-radius: 50%;
}
.cloud::before { width: 60%; height: 60%; top: -30%; left: 10%; }
.cloud::after { width: 50%; height: 50%; top: -20%; right: 10%; }
@keyframes cloudDrift {
  from { transform: translateX(-120%); }
  to { transform: translateX(calc(100vw + 120%)); }
}

/* ============================================================
   MOON
   ============================================================ */
.moon {
  position: absolute; top: 40px; right: 60px;
  width: 70px; height: 70px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #FFFDE7, #FFE082 60%, transparent 70%);
  box-shadow: 0 0 40px rgba(255,224,130,0.4), 0 0 80px rgba(255,224,130,0.2), 0 0 120px rgba(255,224,130,0.1);
  z-index: 3; pointer-events: none;
  animation: moonGlow 5s ease-in-out infinite;
}
@keyframes moonGlow {
  0%, 100% { box-shadow: 0 0 40px rgba(255,224,130,0.4), 0 0 80px rgba(255,224,130,0.2); }
  50% { box-shadow: 0 0 50px rgba(255,224,130,0.5), 0 0 100px rgba(255,224,130,0.3); }
}

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width: 768px) {
  :root { --sidebar-width: 0px; }

  .mobile-menu-btn { display: flex; }

  #main-app {
    grid-template-columns: 1fr;
  }

  #sidebar {
    position: fixed; left: 0; top: 0; bottom: 0;
    width: 280px;
    transform: translateX(-100%);
    transition: transform 0.35s ease;
    z-index: 50;
  }
  #sidebar.open { transform: translateX(0); }

  .sidebar-overlay.show { display: block; }

  .reading-card-wrapper {
    width: 92%;
    height: 88%;
    margin-top: 30px;
  }
  .card-header { padding: 20px 24px 12px; }
  .card-header .story-title { font-size: 24px; }
  .card-body { padding: 16px 24px 24px; font-size: var(--font-size-sm); }

  .welcome-title { font-size: 28px; }
  .welcome-subtitle { font-size: 14px; }
  .book { width: 200px; height: 260px; }
  .book-cover::after { font-size: 56px; }

  .moon { width: 50px; height: 50px; top: 20px; right: 20px; }
  .controls-bar { bottom: 12px; right: 12px; gap: 8px; }
  .control-btn { width: 38px; height: 38px; font-size: 17px; }
}

@media (max-width: 480px) {
  .reading-card-wrapper { width: 96%; height: 85%; }
  .card-header .story-title { font-size: 21px; }
  .card-body { font-size: var(--font-size-sm); padding: 12px 18px 18px; }
  .welcome-title { font-size: 24px; padding: 0 20px; }
}
</style>
<style id="reading-page-redesign">
:root {
  --page: #F6EBDD; --nav: #FFFDF7; --paper: #FFF9ED; --ink: #4A3026;
  --body-ink: #4A403A; --muted: #84695C; --coral: #EE7B4B; --yellow: #F4C95D;
  --sage: #83A97A; --selected: #FBE3C7; --line: #E8D1B4; --sidebar: 270px;
  --reader-size: 21px; --reader-leading: 1.95;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; overflow: hidden; }
body { margin: 0; opacity: 1 !important; background: var(--page) !important; color: var(--ink); font-family: "Noto Serif SC", "Songti SC", "STSong", serif; user-select: text; }
button { font: inherit; }
#welcome-overlay, .canvas-layer, .ambient-light, .moon, #clouds-container, .last-read-indicator { display: none !important; }
#main-app { display: grid; grid-template-rows: 68px 1fr; grid-template-columns: var(--sidebar) 1fr; height: 100vh; opacity: 1 !important; background: var(--page); }
.topbar { grid-column: 1 / -1; height: 68px; display: grid; grid-template-columns: var(--sidebar) 1fr auto; align-items: center; gap: 24px; padding: 0 32px 0 28px; background: var(--nav); border-bottom: 1px solid var(--line); box-shadow: 0 2px 10px rgba(103,74,48,.05); z-index: 20; }
.brand { display: inline-flex; align-items: center; gap: 10px; color: var(--ink); font-weight: 700; letter-spacing: .04em; white-space: nowrap; }
.brand-mark { width: 27px; height: 24px; color: var(--coral); }
.top-nav { display: flex; align-items: center; justify-content: center; gap: 30px; height: 100%; }
.top-nav a { position: relative; display: inline-flex; align-items: center; height: 100%; color: var(--muted); text-decoration: none; font-size: 14px; }
.top-nav a.active { color: var(--ink); font-weight: 700; }
.top-nav a.active::after { content: ""; position: absolute; left: 3px; right: 3px; bottom: 0; height: 3px; background: var(--coral); border-radius: 3px 3px 0 0; }
.top-actions { display: flex; align-items: center; gap: 10px; }

<script>
/* ============================================================
   STORY DATA — 30 Andersen Fairy Tales
   ============================================================ */
const stories = [
  {
    id: 'little-mermaid',
    title: '海的女儿',
    subtitle: 'The Little Mermaid',
    icon: '🧜‍♀️',
    background: 'ocean',
    summary: '在大海深处，住着一位美丽的小人鱼公主，她为了爱情，愿意付出一切……',
    content: `
      <p>在蔚蓝的大海深处，住着海王的一家。海王有六个美丽的女儿，最小的那个长得最漂亮，她的皮肤像玫瑰花瓣一样光滑细嫩，眼睛像最深的海水一样蓝。</p>
      <p>小公主最喜欢听祖母讲人类世界的故事。祖母说："等你满了十五岁，就可以浮到海面上去看人类的世界了。"</p>
      <p>终于，小公主十五岁了。她兴奋地浮到海面上，正好看见一艘大船，船上在举办派对。甲板上站着一位英俊的王子，他有乌黑的头发和温暖的笑容，小公主一下子就被他吸引住了。</p>
      <p>忽然，暴风雨来了！大船被打翻，王子掉进了海里。小公主急忙游过去，把昏迷的王子托出水面，带到了岸边。她把王子放在沙滩上，然后躲到礁石后面偷偷看着。</p>
      <p>过了一会儿，一位邻国的公主路过，发现了王子。王子醒来后，以为是这位公主救了他，对她非常感激。小人鱼看到这一幕，心里难过极了。</p>
      <p>回到海底后，小公主日夜思念王子。她去找海底的女巫帮忙。女巫说："我可以把你的鱼尾变成人类的双腿，但是你每走一步都会像踩在刀尖上一样疼。而且，如果王子娶了别人，你就会变成海上的泡沫。"</p>
      <p>小公主毫不犹豫地答应了。她喝下女巫的药水，鱼尾变成了修长的双腿。王子在海边发现了她，把她带回了王宫。王子很喜欢她，每天都和她在一起跳舞、聊天，但王子心里始终惦记着那个"救了他"的邻国公主。</p>
      <p>后来，王子真的娶了那位邻国公主。小公主的心碎了。她的姐姐们用长发换来一把匕首，让她在天亮前刺进王子的心脏，只要王子的血流到她腿上，她就能变回人鱼回到海里。</p>
      <p>但小公主下不了手。她最后看了一眼熟睡的王子，转身跳进了大海。当太阳升起来的时候，她感到自己正慢慢变成泡沫……但奇怪的是，她没有消失，反而变成了空气中透明的精灵，飘向了温暖的天空。</p>
    `
  },
  {
    id: 'ugly-duckling',
    title: '丑小鸭',
    subtitle: 'The Ugly Duckling',
    icon: '🦢',
    background: 'lake',
    summary: '一只与众不同的小鸭子，经历了无数嘲笑和磨难，最终发现自己原来是一只美丽的白天鹅。',
    content: `
      <p>夏天的乡间真美啊！金黄的麦浪在风中轻轻摇摆，绿油油的草地上开满了野花。在一条小溪边，鸭妈妈正在窝里孵蛋。</p>
      <p>"噼！噼！"蛋一个接一个裂开了，毛茸茸的小鸭子们钻了出来。可是，最大的那个蛋还没有动静。又过了好几天，这个蛋终于裂开了，从里面钻出来一只又大又丑的小鸭子。</p>
      <p>鸭妈妈看了看它，有点担心："这孩子怎么长得这么大、这么丑呢？该不会是一只火鸡吧？"但是小鸭子会游泳，游得比谁都好，鸭妈妈这才放心了。</p>
      <p>可是，农场里的其他动物都嘲笑这只丑小鸭。鸭子们咬它，鸡啄它，连喂食的女佣也用脚踢它。丑小鸭伤心极了，它决定离开农场，独自去流浪。</p>
      <p>丑小鸭逃到了沼泽地，遇到了野鸭。野鸭说："你虽然丑，但只要不跟我们家族通婚，你可以留下来。"可是没过多久，猎人来了，砰砰的枪声把丑小鸭吓得魂飞魄散。</p>
      <p>丑小鸭又逃到了一个小木屋，里面住着一个老太太、一只猫和一只母鸡。母鸡说："你会下蛋吗？"丑小鸭摇摇头。猫说："你会弓背喵喵叫吗？"丑小鸭又摇摇头。"那你就别说废话了！"</p>

/* ============================================================
   CANVAS BACKGROUND SYSTEM
   ============================================================ */
const bgCanvas = document.getElementById('bg-canvas');
const particleCanvas = document.getElementById('particle-canvas');
const bgCtx = bgCanvas.getContext('2d');
const pCtx = particleCanvas.getContext('2d');

let particles = [];
let animFrameId = null;
let currentBg = 'ocean';

function resizeCanvases() {
  const area = document.getElementById('content-area');
  const w = area.clientWidth;
  const h = area.clientHeight;
  bgCanvas.width = particleCanvas.width = w;
  bgCanvas.height = particleCanvas.height = h;
}

class Particle {
  constructor(x, y, type) {
    this.x = x;
    this.y = y;
    this.type = type; // 'snow' | 'bubble' | 'firefly' | 'star' | 'petal' | 'ice' | 'gold'
    this.reset();
  }
  reset() {
    const W = particleCanvas.width;
    const H = particleCanvas.height;
    switch (this.type) {
      case 'snow':
        this.x = Math.random() * W;
        this.y = -10;
        this.r = Math.random() * 3 + 1.5;
        this.speed = Math.random() * 0.8 + 0.3;
        this.wind = Math.random() * 0.4 - 0.2;
        this.opacity = Math.random() * 0.7 + 0.3;
        break;
      case 'bubble':
        this.x = Math.random() * W;
        this.y = H + 10;
        this.r = Math.random() * 4 + 2;
        this.speed = Math.random() * 0.5 + 0.2;
        this.wind = Math.random() * 0.6 - 0.3;
        this.opacity = Math.random() * 0.4 + 0.15;
        break;
      case 'firefly':
        this.x = Math.random() * W;
        this.y = Math.random() * H;
        this.r = Math.random() * 1.5 + 1;
        this.speed = Math.random() * 0.3 + 0.1;
        this.angle = Math.random() * Math.PI * 2;
        this.opacity = 0;
        this.targetOpacity = Math.random() * 0.8 + 0.2;
        this.flickerSpeed = Math.random() * 0.03 + 0.01;
        break;
      case 'star':
        this.x = Math.random() * W;
        this.y = Math.random() * H * 0.7;
        this.r = Math.random() * 1.5 + 0.8;
        this.opacity = Math.random();
        this.twinkleSpeed = Math.random() * 0.02 + 0.005;
        this.twinkleOffset = Math.random() * Math.PI * 2;
        break;
      case 'petal':
        this.x = Math.random() * W;
        this.y = -10;
        this.r = Math.random() * 3 + 2;
        this.speed = Math.random() * 0.4 + 0.15;
        this.wind = Math.random() * 0.5 - 0.25;
        this.opacity = Math.random() * 0.6 + 0.4;
        this.rotation = Math.random() * Math.PI * 2;
        this.rotSpeed = Math.random() * 0.02 - 0.01;
        break;
      case 'ice':
        this.x = Math.random() * W;
        this.y = -10;
        this.r = Math.random() * 3 + 1;
        this.speed = Math.random() * 0.3 + 0.1;
        this.wind = Math.random() * 0.3 - 0.15;
        this.opacity = Math.random() * 0.6 + 0.3;
        break;
      case 'gold':
        this.x = Math.random() * W;
        this.y = Math.random() * H;
        this.r = Math.random() * 2 + 0.8;
        this.speed = Math.random() * 0.2 + 0.05;
        this.opacity = Math.random() * 0.7 + 0.3;
        this.angle = Math.random() * Math.PI * 2;
        break;
      default:
        this.x = Math.random() * W;
        this.y = Math.random() * H;
        this.r = 2;
        this.opacity = 0.5;
    }
  }
  update() {
    const W = particleCanvas.width;
    const H = particleCanvas.height;
    switch (this.type) {
      case 'snow':
        this.y += this.speed;
        this.x += this.wind + Math.sin(this.y * 0.02) * 0.3;
        if (this.y > H + 10) { this.y = -10; this.x = Math.random() * W; }
        break;
      case 'bubble':
        this.y -= this.speed;
        this.x += this.wind + Math.sin(this.y * 0.03) * 0.5;
        if (this.y < -10) { this.y = H + 10; this.x = Math.random() * W; }
        break;
      case 'firefly':
        this.angle += this.speed;
        this.x += Math.cos(this.angle) * 0.4;
        this.y += Math.sin(this.angle) * 0.3;
        this.opacity += (this.targetOpacity - this.opacity) * this.flickerSpeed;
        if (Math.abs(this.opacity - this.targetOpacity) < 0.05) {
          this.targetOpacity = Math.random() * 0.8 + 0.2;
        }
        if (this.x < 0) this.x = W;
        if (this.x > W) this.x = 0;
        if (this.y < 0) this.y = H;
        if (this.y > H) this.y = 0;
        break;
      case 'star':
        this.opacity = Math.sin(Date.now() * this.twinkleSpeed + this.twinkleOffset) * 0.5 + 0.5;
        break;
      case 'petal':
        this.y += this.speed;
        this.x += this.wind + Math.sin(this.y * 0.015) * 0.5;
        this.rotation += this.rotSpeed;
        if (this.y > H + 10) { this.y = -10; this.x = Math.random() * W; }
        break;
      case 'ice':
        this.y += this.speed;
        this.x += this.wind;
        this.opacity = 0.4 + Math.sin(Date.now() * 0.003 + this.x * 0.01) * 0.3;
        if (this.y > H + 10) { this.y = -10; this.x = Math.random() * W; }
        break;
      case 'gold':
        this.angle += this.speed * 0.5;
        this.y += Math.sin(this.angle) * 0.3;
        this.x += Math.cos(this.angle) * 0.2;
        this.opacity = 0.3 + Math.sin(Date.now() * 0.004 + this.x * 0.01) * 0.4;
        if (this.y < 0) this.y = H;
        if (this.y > H) this.y = 0;
        if (this.x < 0) this.x = W;
        if (this.x > W) this.x = 0;
        break;
    }
  }
  draw(ctx) {
    ctx.save();
    ctx.globalAlpha = this.opacity;
    switch (this.type) {
      case 'snow':
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
        ctx.fill();
        break;
      case 'bubble':
        ctx.strokeStyle = 'rgba(255,255,255,0.6)';
        ctx.lineWidth = 0.5;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
        ctx.stroke();
        ctx.fillStyle = 'rgba(255,255,255,0.08)';
        ctx.fill();
        break;
      case 'firefly':
        const glow = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.r * 4);
        glow.addColorStop(0, 'rgba(255, 240, 150, 0.9)');
        glow.addColorStop(0.3, 'rgba(255, 220, 100, 0.4)');
        glow.addColorStop(1, 'rgba(255, 200, 50, 0)');
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.r * 4, 0, Math.PI * 2);
        ctx.fill();
        break;
      case 'star':
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
        ctx.fill();
        break;
      case 'petal':
        ctx.fillStyle = `rgba(${255 - Math.random()*30}, ${180 + Math.random()*40}, ${200 + Math.random()*30}, ${this.opacity})`;
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);
        ctx.beginPath();
        ctx.ellipse(0, 0, this.r, this.r * 0.6, 0, 0, Math.PI * 2);
        ctx.fill();
        break;
      case 'ice':
        ctx.fillStyle = 'rgba(200, 220, 255, 0.7)';
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
        ctx.fill();
        break;
      case 'gold':
        const gglow = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.r * 3);
        gglow.addColorStop(0, 'rgba(255, 215, 0, 0.8)');
        gglow.addColorStop(1, 'rgba(255, 200, 0, 0)');
        ctx.fillStyle = gglow;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.r * 3, 0, Math.PI * 2);
        ctx.fill();
        break;
    }
    ctx.restore();
  }
}

function createParticles(type, count) {
  const arr = [];
  for (let i = 0; i < count; i++) {
    arr.push(new Particle(0, 0, type));
  }
  return arr;
}

function setParticlesForBackground(bgType) {
  particles = [];
  // Always have stars
  particles.push(...createParticles('star', 80));

  switch (bgType) {
    case 'ocean':
      particles.push(...createParticles('bubble', 50));
      break;
    case 'snow_night':
      particles.push(...createParticles('snow', 100));
      break;
    case 'lake':
      particles.push(...createParticles('firefly', 30));
      particles.push(...createParticles('bubble', 15));
      break;
    case 'castle':
      particles.push(...createParticles('gold', 40));
      break;
    case 'forest':
      particles.push(...createParticles('firefly', 60));
      break;
    case 'garden':
    case 'flower_field':
      particles.push(...createParticles('petal', 35));
      particles.push(...createParticles('firefly', 20));
      break;
    case 'ice_palace':
      particles.push(...createParticles('ice', 50));
      break;
    case 'river':
      particles.push(...createParticles('bubble', 30));
      particles.push(...createParticles('firefly', 15));
      break;
    case 'autumn':
      particles.push(...createParticles('petal', 40));
      break;
    default:
      particles.push(...createParticles('firefly', 25));
  }
}

function drawBgSky(bgType) {
  const W = bgCanvas.width;
  const H = bgCanvas.height;

  switch (bgType) {
    case 'ocean':
      const oceanGrad = bgCtx.createLinearGradient(0, 0, 0, H);
      oceanGrad.addColorStop(0, '#0a1628');
      oceanGrad.addColorStop(0.4, '#0d2847');
      oceanGrad.addColorStop(0.7, '#0f3460');
      oceanGrad.addColorStop(1, '#0a1e3d');
      bgCtx.fillStyle = oceanGrad;
      bgCtx.fillRect(0, 0, W, H);
      // Water surface waves
      bgCtx.strokeStyle = 'rgba(255,255,255,0.04)';
      bgCtx.lineWidth = 1;
      const t = Date.now() * 0.0005;
      for (let i = 0; i < 8; i++) {
        bgCtx.beginPath();
        const yBase = H * (0.4 + i * 0.07);
        for (let x = 0; x < W; x += 3) {
          const y = yBase + Math.sin(x * 0.01 + t + i) * 8 + Math.cos(x * 0.02 + t * 0.7) * 4;
          if (x === 0) bgCtx.moveTo(x, y);
          else bgCtx.lineTo(x, y);
        }
        bgCtx.stroke();
      }
      break;

    case 'snow_night':
      const snowGrad = bgCtx.createLinearGradient(0, 0, 0, H);
      snowGrad.addColorStop(0, '#0d1525');
      snowGrad.addColorStop(0.5, '#121d33');
      snowGrad.addColorStop(1, '#1a2740');
      bgCtx.fillStyle = snowGrad;
      bgCtx.fillRect(0, 0, W, H);
      // Warm window lights
      for (let i = 0; i < 5; i++) {
        const wx = W * (0.15 + i * 0.18);
        const wy = H * (0.5 + Math.sin(i * 1.3) * 0.15);
        const glow = bgCtx.createRadialGradient(wx, wy, 0, wx, wy, 60);
        glow.addColorStop(0, 'rgba(255, 180, 80, 0.2)');
        glow.addColorStop(0.5, 'rgba(255, 150, 50, 0.08)');
        glow.addColorStop(1, 'rgba(255, 100, 30, 0)');
        bgCtx.fillStyle = glow;
        bgCtx.fillRect(wx - 60, wy - 60, 120, 120);
      }
      break;

    case 'lake':
      const lakeGrad = bgCtx.createLinearGradient(0, 0, 0, H);
      lakeGrad.addColorStop(0, '#87CEEB');
      lakeGrad.addColorStop(0.35, '#B0D4E8');
      lakeGrad.addColorStop(0.5, '#4A7C9B');
      lakeGrad.addColorStop(1, '#2C5F7C');
      bgCtx.fillStyle = lakeGrad;
      bgCtx.fillRect(0, 0, W, H);
      // Sun glow
      const sunGlow = bgCtx.createRadialGradient(W * 0.7, H * 0.25, 20, W * 0.7, H * 0.25, 200);
      sunGlow.addColorStop(0, 'rgba(255, 240, 200, 0.6)');
      sunGlow.addColorStop(0.3, 'rgba(255, 220, 150, 0.2)');
      sunGlow.addColorStop(1, 'rgba(255, 200, 100, 0)');
      bgCtx.fillStyle = sunGlow;
      bgCtx.fillRect(0, 0, W, H);
      break;

    case 'castle':
      const castleGrad = bgCtx.createLinearGradient(0, 0, 0, H);
      castleGrad.addColorStop(0, '#1a0f0a');
      castleGrad.addColorStop(0.3, '#3d1c0f');
      castleGrad.addColorStop(0.6, '#5c2818');
      castleGrad.addColorStop(1, '#2a150a');
      bgCtx.fillStyle = castleGrad;
      bgCtx.fillRect(0, 0, W, H);
      break;

    case 'forest':
      const forestGrad = bgCtx.createLinearGradient(0, 0, 0, H);
      forestGrad.addColorStop(0, '#0a1a0a');
      forestGrad.addColorStop(0.4, '#0d2810');
      forestGrad.addColorStop(0.7, '#0f3015');
      forestGrad.addColorStop(1, '#081808');
      bgCtx.fillStyle = forestGrad;
      bgCtx.fillRect(0, 0, W, H);
      break;

    case 'garden':
    case 'flower_field':
      const gardenGrad = bgCtx.createLinearGradient(0, 0, 0, H);
      gardenGrad.addColorStop(0, '#e8d5f0');
      gardenGrad.addColorStop(0.3, '#f5e6d3');
      gardenGrad.addColorStop(0.6, '#e0f0e0');
      gardenGrad.addColorStop(1, '#c8d8c0');
      bgCtx.fillStyle = gardenGrad;
      bgCtx.fillRect(0, 0, W, H);
      break;

    case 'ice_palace':
      const iceGrad = bgCtx.createLinearGradient(0, 0, 0, H);
      iceGrad.addColorStop(0, '#0a1030');
      iceGrad.addColorStop(0.4, '#0d1840');
      iceGrad.addColorStop(0.7, '#102050');
      iceGrad.addColorStop(1, '#0a1535');
      bgCtx.fillStyle = iceGrad;
      bgCtx.fillRect(0, 0, W, H);
      break;

    case 'river':
      const riverGrad = bgCtx.createLinearGradient(0, 0, 0, H);
      riverGrad.addColorStop(0, '#87CEEB');
      riverGrad.addColorStop(0.4, '#B0C4DE');
      riverGrad.addColorStop(0.6, '#5B8FA8');
      riverGrad.addColorStop(1, '#3A6A80');
      bgCtx.fillStyle = riverGrad;
      bgCtx.fillRect(0, 0, W, H);
      break;

    case 'autumn':
      const autumnGrad = bgCtx.createLinearGradient(0, 0, 0, H);
      autumnGrad.addColorStop(0, '#d4a574');
      autumnGrad.addColorStop(0.3, '#e8c9a0');
      autumnGrad.addColorStop(0.6, '#c4956a');
      autumnGrad.addColorStop(1, '#a07550');
      bgCtx.fillStyle = autumnGrad;
      bgCtx.fillRect(0, 0, W, H);
      break;

    default:
      const defGrad = bgCtx.createLinearGradient(0, 0, 0, H);
      defGrad.addColorStop(0, '#0a1628');
      defGrad.addColorStop(0.5, '#0f2040');
      defGrad.addColorStop(1, '#0a1830');
      bgCtx.fillStyle = defGrad;
      bgCtx.fillRect(0, 0, W, H);
  }
}

function renderCanvases() {
  const W = particleCanvas.width;
  const H = particleCanvas.height;

  // Draw background sky
  drawBgSky(currentBg);

  // Draw particles
  pCtx.clearRect(0, 0, W, H);
  particles.forEach(p => {
    p.update();
    p.draw(pCtx);
  });

  animFrameId = requestAnimationFrame(renderCanvases);
}

function switchBackground(bgType) {
  currentBg = bgType;
  setParticlesForBackground(bgType);
  // Update moon visibility
  const moon = document.getElementById('moon');
  if (['garden', 'flower_field', 'lake', 'river', 'autumn'].includes(bgType)) {
    moon.style.opacity = '0';
  } else {
    moon.style.opacity = '1';
  }
}

/* ============================================================
   AUDIO SYSTEM (Web Audio API - gentle music box tones)
   ============================================================ */
let audioCtx = null;
let musicInterval = null;
const pentatonicNotes = [262, 294, 330, 392, 440, 523, 588, 660, 784, 880]; // C pentatonic

function startMusic() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  playNote();
  musicInterval = setInterval(() => {
    if (state.musicOn) playNote();
  }, 1800 + Math.random() * 1200);
}

function stopMusic() {
  if (musicInterval) clearInterval(musicInterval);
  musicInterval = null;
}

function playNote() {
  if (!audioCtx || !state.musicOn) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);

  const note = pentatonicNotes[Math.floor(Math.random() * pentatonicNotes.length)];
  osc.frequency.value = note;
  osc.type = 'sine';

  const now = audioCtx.currentTime;
  gain.gain.setValueAtTime(0, now);
  gain.gain.linearRampToValueAtTime(0.06, now + 0.3);
  gain.gain.linearRampToValueAtTime(0.03, now + 0.8);
  gain.gain.linearRampToValueAtTime(0, now + 2.0);

  osc.start(now);
  osc.stop(now + 2.0);
}

async function toggleMusic() {
  const btn = document.getElementById('btn-music');
  if (!state.musicOn) {
    state.musicOn = true;
    btn.textContent = '🔔';
    btn.classList.add('active');
    if (!audioCtx) startMusic();
    else {
      if (audioCtx.state === 'suspended') await audioCtx.resume();
      startMusic();
    }
  } else {
    state.musicOn = false;
    btn.textContent = '🔇';
    btn.classList.remove('active');
    stopMusic();
  }
  saveState();
}

/* ============================================================
   UI RENDERING
   ============================================================ */
function buildSidebar() {
  const listEl = document.getElementById('story-list');
  listEl.innerHTML = stories.map(s => `
    <div class="story-item${s.id === state.currentStoryId ? ' active' : ''}" data-id="${s.id}">
      <span class="icon">${s.icon}</span>
      <span class="name">${s.title}</span>
    </div>
  `).join('');

  // Click handlers
  listEl.querySelectorAll('.story-item').forEach(item => {
    item.addEventListener('click', () => {
      const id = item.dataset.id;
      if (id !== state.currentStoryId) switchStory(id);
      // Close sidebar on mobile
      document.getElementById('sidebar').classList.remove('open');
      document.getElementById('sidebar-overlay').classList.remove('show');
    });
  });

  // Scroll active into view
  const activeItem = listEl.querySelector('.story-item.active');
  if (activeItem) {
    setTimeout(() => activeItem.scrollIntoView({ behavior: 'smooth', block: 'center' }), 300);
  }
}

function switchStory(id) {
  const story = stories.find(s => s.id === id);
  if (!story) return;

  state.currentStoryId = id;

  // Flip animation
  const wrapper = document.getElementById('card-wrapper');
  wrapper.classList.remove('page-flip');
  void wrapper.offsetWidth;
  wrapper.classList.add('page-flip');

  // Update content
  document.getElementById('story-title').textContent = story.title;
  document.getElementById('story-subtitle').textContent = story.subtitle;
  document.getElementById('story-summary').textContent = story.summary;
  document.getElementById('card-body').innerHTML = story.content;

  // Switch background
  switchBackground(story.background);

  // Update sidebar
  buildSidebar();

  // Reset scroll
  document.getElementById('card-body').scrollTop = 0;
  document.getElementById('progress-bar').style.width = '0%';

  // Show last read badge
  updateLastReadBadge();

  saveState();
}

function updateLastReadBadge() {
  const badge = document.getElementById('last-read-badge');
  const saved = localStorage.getItem('andersen-last-story');
  if (saved && saved !== state.currentStoryId) {
    const story = stories.find(s => s.id === saved);
    if (story) {
      document.getElementById('last-read-name').textContent = story.title;
      badge.style.display = 'block';
      badge.onclick = () => switchStory(saved);
      badge.style.cursor = 'pointer';
      return;
    }
  }
  badge.style.display = 'none';
}

/* ============================================================
   CONTROLS
   ============================================================ */
function toggleDarkMode() {
  state.darkMode = !state.darkMode;
  document.body.classList.toggle('night', state.darkMode);
  document.getElementById('btn-night').textContent = state.darkMode ? '☀️' : '🌙';
  if (state.darkMode) {
    document.getElementById('btn-night').classList.add('active');
  } else {
    document.getElementById('btn-night').classList.remove('active');
  }
  saveState();
}

function cycleFontSize() {
  const sizes = ['small', 'medium', 'large'];
  const idx = sizes.indexOf(state.fontSize);
  state.fontSize = sizes[(idx + 1) % 3];

  const root = document.documentElement;
  const badge = document.querySelector('.font-size-badge');
  switch (state.fontSize) {
    case 'small':
      root.style.setProperty('--font-size-md', '16px');
      badge.textContent = '小';
      break;
    case 'medium':
      root.style.setProperty('--font-size-md', '19px');
      badge.textContent = '中';
      break;
    case 'large':
      root.style.setProperty('--font-size-md', '22px');
      badge.textContent = '大';
      break;
  }
  saveState();
}

/* ============================================================
   PERSISTENCE
   ============================================================ */
function saveState() {
  localStorage.setItem('andersen-current-story', state.currentStoryId);
  localStorage.setItem('andersen-last-story', state.currentStoryId);
  localStorage.setItem('andersen-dark-mode', state.darkMode);
  localStorage.setItem('andersen-font-size', state.fontSize);
  localStorage.setItem('andersen-music', state.musicOn);
}

function loadState() {
  const story = localStorage.getItem('andersen-current-story');
  if (story && stories.some(s => s.id === story)) {
    state.currentStoryId = story;
  }
  state.darkMode = localStorage.getItem('andersen-dark-mode') === 'true';
  state.fontSize = localStorage.getItem('andersen-font-size') || 'medium';
  state.musicOn = localStorage.getItem('andersen-music') === 'true';

  if (state.darkMode) {
    document.body.classList.add('night');
    document.getElementById('btn-night').textContent = '☀️';
    document.getElementById('btn-night').classList.add('active');
  }

  const root = document.documentElement;
  switch (state.fontSize) {
    case 'small':
      root.style.setProperty('--font-size-md', '16px');
      document.querySelector('.font-size-badge').textContent = '小';
      break;
    case 'large':
      root.style.setProperty('--font-size-md', '22px');
      document.querySelector('.font-size-badge').textContent = '大';
      break;
    default:
      root.style.setProperty('--font-size-md', '19px');
      document.querySelector('.font-size-badge').textContent = '中';
  }
}

/* ============================================================
   READING PROGRESS
   ============================================================ */
function setupProgressTracking() {
  const cardBody = document.getElementById('card-body');
  const progressBar = document.getElementById('progress-bar');

  cardBody.addEventListener('scroll', () => {
    const scrollTop = cardBody.scrollTop;
    const scrollHeight = cardBody.scrollHeight - cardBody.clientHeight;
    if (scrollHeight > 0) {
      const pct = (scrollTop / scrollHeight) * 100;
      progressBar.style.width = pct + '%';
      // Save position
      const story = stories.find(s => s.id === state.currentStoryId);
      if (story) {
        localStorage.setItem('andersen-scroll-' + state.currentStoryId, scrollTop);
      }
    }
  });
}

function restoreScrollPosition() {
  const cardBody = document.getElementById('card-body');
  const savedScroll = localStorage.getItem('andersen-scroll-' + state.currentStoryId);
  if (savedScroll) {
    setTimeout(() => { cardBody.scrollTop = parseInt(savedScroll); }, 200);
  }
}

/* ============================================================
   WELCOME PAGE
   ============================================================ */
function generateWelcomeStars() {
  const container = document.getElementById('welcome-stars');
  let html = '';
  for (let i = 0; i < 150; i++) {
    const x = Math.random() * 100;
    const y = Math.random() * 100;
    const dur = 1.5 + Math.random() * 4;
    const delay = Math.random() * 3;
    html += `<div class="welcome-star" style="left:${x}%;top:${y}%;--dur:${dur}s;--delay:${delay}s"></div>`;
  }
  container.innerHTML = html;
}

function generateWelcomeParticles() {
  const container = document.getElementById('welcome-particles');
  const emojis = ['✨', '⭐', '🌙', '❄️', '🕯️', '🌸', '🍂', '🫧'];
  let html = '';
  for (let i = 0; i < 30; i++) {
    const left = Math.random() * 100;
    const dur = 8 + Math.random() * 15;
    const delay = Math.random() * 10;
    const size = 16 + Math.random() * 24;
    const emoji = emojis[Math.floor(Math.random() * emojis.length)];
    html += `<span class="welcome-particle" style="left:${left}%;--dur:${dur}s;--delay:${delay}s;--size:${size}px">${emoji}</span>`;
  }
  container.innerHTML = html;
}

function enterApp() {
  document.getElementById('welcome-overlay').classList.add('hidden');
  document.getElementById('main-app').classList.add('visible');
  state.welcomeDone = true;

  // Restore last story position
  setTimeout(restoreScrollPosition, 600);
  updateLastReadBadge();
}

/* ============================================================
   MOBILE MENU
   ============================================================ */
function setupMobileMenu() {
  const toggle = document.getElementById('menu-toggle');
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('sidebar-overlay');

  toggle.addEventListener('click', () => {
    sidebar.classList.toggle('open');
    overlay.classList.toggle('show');
  });
  overlay.addEventListener('click', () => {
    sidebar.classList.remove('open');
    overlay.classList.remove('show');
  });
}

/* ============================================================
   INITIALIZATION
   ============================================================ */
function init() {
  // Load saved state
  loadState();

  // Generate welcome page
  generateWelcomeStars();
  generateWelcomeParticles();

  // Build sidebar
  buildSidebar();

  // Load initial story
  const story = stories.find(s => s.id === state.currentStoryId) || stories[0];
  document.getElementById('story-title').textContent = story.title;
  document.getElementById('story-subtitle').textContent = story.subtitle;
  document.getElementById('story-summary').textContent = story.summary;
  document.getElementById('card-body').innerHTML = story.content;

  // Setup canvas
  resizeCanvases();
  switchBackground(story.background);
  renderCanvases();

  // Setup controls
  document.getElementById('enter-btn').addEventListener('click', enterApp);
  document.getElementById('btn-night').addEventListener('click', toggleDarkMode);
  document.getElementById('btn-font').addEventListener('click', cycleFontSize);
  document.getElementById('btn-music').addEventListener('click', toggleMusic);

  // Setup mobile menu
  setupMobileMenu();

  // Setup progress tracking
  setupProgressTracking();

  // Handle resize
  window.addEventListener('resize', () => {
    resizeCanvases();
  });

  // Keyboard shortcuts
  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      toggleDarkMode();
    }
  });

  // Show body
  document.body.classList.add('loaded');
}

/* Warm picture-book reading page behavior */
function saveState() {
  localStorage.setItem('andersen-current-story', state.currentStoryId);
  localStorage.setItem('andersen-dark-mode', String(state.darkMode));
  localStorage.setItem('andersen-font-size', state.fontSize);
  localStorage.setItem('andersen-music', String(state.musicOn));
}

function loadState() {
  const storyId = localStorage.getItem('andersen-current-story');
  if (stories.some(story => story.id === storyId)) state.currentStoryId = storyId;
  state.darkMode = localStorage.getItem('andersen-dark-mode') === 'true';
  state.fontSize = localStorage.getItem('andersen-font-size') || 'medium';
  state.musicOn = false;
  document.body.classList.toggle('night', state.darkMode);
  applyFontSize();
}

function applyFontSize() {
  const sizes = { small: '18px', medium: '21px', large: '23px' };
  document.documentElement.style.setProperty('--reader-size', sizes[state.fontSize] || sizes.medium);
  const button = document.getElementById('btn-font');
  if (button) button.title = `正文字号：${{ small: '小', medium: '中', large: '大' }[state.fontSize]}`;
}

function buildSidebar() {
  const visibleStories = stories.slice(0, 10);
  document.getElementById('story-list').innerHTML = visibleStories.map((story, index) => `
    <button class="story-item${story.id === state.currentStoryId ? ' active' : ''}" data-id="${story.id}" aria-current="${story.id === state.currentStoryId ? 'page' : 'false'}">
      <span class="story-cover" aria-hidden="true"></span>
      <span class="story-meta"><span class="name">${story.title}</span><span class="story-status">${story.id === state.currentStoryId ? '阅读中 · 18%' : index < 3 ? '已读一部分' : '未开始'}</span></span>
    </button>`).join('');
  document.querySelectorAll('.story-item').forEach(item => item.addEventListener('click', () => {
    switchStory(item.dataset.id);
    closeSidebar();
  }));
}

function updateProgress(percent) {
  const rounded = Math.max(0, Math.min(100, Math.round(percent)));
  document.getElementById('progress-bar').style.width = `${rounded}%`;
  document.getElementById('progress-percent').textContent = `${rounded}%`;
  document.getElementById('progress-text').textContent = `阅读进度 ${rounded}%`;
  document.getElementById('time-left').textContent = `预计剩余 ${Math.max(1, Math.ceil((100 - rounded) / 14))} 分钟`;
}

function switchStory(id) {
  const story = stories.find(item => item.id === id);
  if (!story) return;
  state.currentStoryId = id;
  const wrapper = document.getElementById('card-wrapper');
  wrapper.style.animation = 'none'; void wrapper.offsetWidth; wrapper.style.animation = 'paperRise .22s ease';
  document.getElementById('story-title').textContent = story.title;
  const body = document.getElementById('card-body');
  body.innerHTML = story.content; body.scrollTop = 0;
  updateProgress(0); buildSidebar(); saveState();
}

function cycleFontSize() {
  const sizes = ['small', 'medium', 'large'];
  state.fontSize = sizes[(sizes.indexOf(state.fontSize) + 1) % sizes.length];
  applyFontSize(); saveState();
}

function toggleDarkMode() {
  state.darkMode = !state.darkMode;
  document.body.classList.toggle('night', state.darkMode);
  document.getElementById('btn-night').classList.toggle('active', state.darkMode);
  saveState();
}

function toggleMusic() {
  state.musicOn = !state.musicOn;
  const button = document.getElementById('btn-music');
  button.classList.toggle('reading', state.musicOn);
  button.querySelector('span').textContent = state.musicOn ? '暂停' : '朗读';
  if ('speechSynthesis' in window) {
    speechSynthesis.cancel();
    if (state.musicOn) {
      const text = document.getElementById('card-body').innerText;
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'zh-CN'; utterance.rate = .85;
      utterance.onend = () => { state.musicOn = false; button.classList.remove('reading'); button.querySelector('span').textContent = '朗读'; };
      speechSynthesis.speak(utterance);
    }
  }
}

function closeSidebar() { document.getElementById('sidebar').classList.remove('open'); document.getElementById('sidebar-overlay').classList.remove('show'); }
function setupMobileMenu() {
  document.getElementById('menu-toggle').addEventListener('click', () => { document.getElementById('sidebar').classList.toggle('open'); document.getElementById('sidebar-overlay').classList.toggle('show'); });
  document.getElementById('sidebar-overlay').addEventListener('click', closeSidebar);
}

function setupProgressTracking() {
  const body = document.getElementById('card-body');
  body.addEventListener('scroll', () => {
    const max = body.scrollHeight - body.clientHeight;
    const percent = max > 0 ? body.scrollTop / max * 100 : 100;
    updateProgress(percent);
    localStorage.setItem(`andersen-scroll-${state.currentStoryId}`, String(body.scrollTop));
  }, { passive: true });
}

function init() {
  loadState(); buildSidebar();
  const story = stories.find(item => item.id === state.currentStoryId) || stories[0];
  document.getElementById('story-title').textContent = story.title;
  document.getElementById('card-body').innerHTML = story.content;
  updateProgress(18);
  document.getElementById('btn-night').classList.toggle('active', state.darkMode);
  document.getElementById('btn-night').addEventListener('click', toggleDarkMode);
  document.getElementById('btn-font').addEventListener('click', cycleFontSize);
  document.getElementById('btn-music').addEventListener('click', toggleMusic);
  document.getElementById('btn-favorite').addEventListener('click', event => {
    const button = event.currentTarget; button.classList.toggle('active'); button.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.12)' }, { transform: 'scale(1)' }], { duration: 280 });
    button.querySelector('span').textContent = button.classList.contains('active') ? '已收藏' : '收藏';
  });
  document.getElementById('btn-prev').addEventListener('click', () => { const i = stories.findIndex(item => item.id === state.currentStoryId); switchStory(stories[(i - 1 + stories.length) % stories.length].id); });
  document.getElementById('btn-next').addEventListener('click', () => { const i = stories.findIndex(item => item.id === state.currentStoryId); switchStory(stories[(i + 1) % stories.length].id); });
  setupMobileMenu(); setupProgressTracking(); document.body.classList.add('loaded');
}

window.stories = stories;
</script>
